name: Publicar web (iPhone)

on:
  workflow_dispatch:
  push:
    branches: [iphone, main]

permissions:
  contents: write

concurrency:
  group: publicar-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar la carpeta web en la rama gh-pages
        run: |
          rm -rf _site
          cp -r app/src/main/assets/www _site
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar web ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
