name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle assembleDebug --no-daemon

      - name: Preparar nombre y descripción
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          [ -z "$TITLE" ] && TITLE="Compilación manual"
          BODY=$(printf '%s' "$COMMIT_MSG" | tail -n +2)
          cp app/build/outputs/apk/debug/app-debug.apk "Girounivers-v${VER}.apk"
          {
            echo "VER=$VER"
            echo "TITLE=$TITLE"
            echo "APK=Girounivers-v${VER}.apk"
            echo "BODY<<EOF_BODY"
            echo "$BODY"
            echo "EOF_BODY"
          } >> "$GITHUB_ENV"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-${{ github.run_number }}
          name: v${{ env.VER }} · ${{ env.TITLE }}
          body: ${{ env.BODY }}
          draft: false
          prerelease: false
          files: ${{ env.APK }}
