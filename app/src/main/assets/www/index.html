<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04050c">
<title>Girounivers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="bg"></canvas>

<div id="splash"><svg viewBox="0 0 512 512" class="logo-svg" aria-hidden="true">
  <g transform="rotate(-28 256 256)"><defs><clipPath id="cb"><rect x="0" y="0" width="512" height="256"/></clipPath><clipPath id="cf"><rect x="0" y="256" width="512" height="256"/></clipPath></defs>
  <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#fff" stroke-width="14" clip-path="url(#cb)"/>
  <circle cx="256" cy="256" r="94" fill="#fff"/>
  <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#000" stroke-width="38" clip-path="url(#cf)"/>
  <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#fff" stroke-width="14" clip-path="url(#cf)"/></g></svg>
  <div class="splash-title">GIROUNIVERS</div></div>

<div id="app">
  <header id="top">
    <svg viewBox="0 0 512 512" class="logo-mini" aria-hidden="true"><rect width="512" height="512" rx="110" fill="#000"/>
      <g transform="rotate(-28 256 256)"><defs><clipPath id="mb"><rect x="0" y="0" width="512" height="256"/></clipPath><clipPath id="mf"><rect x="0" y="256" width="512" height="256"/></clipPath></defs>
      <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#fff" stroke-width="16" clip-path="url(#mb)"/><circle cx="256" cy="256" r="94" fill="#fff"/>
      <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#000" stroke-width="42" clip-path="url(#mf)"/><ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="#fff" stroke-width="16" clip-path="url(#mf)"/></g></svg>
    <div class="brand"><span>GIROUNIVERS</span><small id="page-title">Cielo</small></div>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙</button>
  </header>

  <main id="main">
    <section class="view" id="view-cielo"></section>
    <section class="view" id="view-sistema"></section>
    <section class="view" id="view-catalogo"></section>
    <section class="view" id="view-retos"></section>
    <section class="view" id="view-agenda"></section>
  </main>

  <nav id="nav">
    <button data-tab="cielo"><svg viewBox="0 0 24 24"><circle cx="5" cy="17" r="1.6"/><circle cx="10" cy="7" r="1.6"/><circle cx="17" cy="13" r="1.6"/><circle cx="20" cy="5" r="1.2"/><path d="M5 17l5-10 7 6 3-8" fill="none"/></svg></button>
    <button data-tab="sistema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="12" rx="9.5" ry="4.5" fill="none" transform="rotate(-25 12 12)"/><circle cx="19" cy="8.6" r="1.3"/></svg></button>
    <button data-tab="catalogo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none"/></svg></button>
    <button data-tab="retos"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z" fill="none"/><circle cx="12" cy="13" r="3.4" fill="none"/></svg></button>
    <button data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2" fill="none"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" fill="none"/><circle cx="12" cy="15" r="1.4"/></svg></button>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="js/astro.js"></script>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/photoui.js"></script>
<script src="js/sky.js"></script>
<script src="js/solar.js"></script>
<script src="js/catalog.js"></script>
<script src="js/challenges.js"></script>
<script src="js/agenda.js"></script>
<script src="js/main.js"></script>
</body>
</html>
