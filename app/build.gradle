plugins { id 'com.android.application' }

// La clave de firma NO está en el repositorio: GitHub Actions la recibe desde los Secrets
// (variables KEYSTORE_FILE y KEYSTORE_PASSWORD). Sin ellas se compila con la clave de depuración.
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.girounivers.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.girounivers.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4'
    }
    signingConfigs {
        if (ksFile) {
            girounivers {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'girounivers'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (ksFile) signingConfig signingConfigs.girounivers }
        release { minifyEnabled false; signingConfig ksFile ? signingConfigs.girounivers : signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
