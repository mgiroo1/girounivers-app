plugins { id 'com.android.application' }
android {
    namespace 'com.girounivers.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.girounivers.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.2'
    }
    signingConfigs {
        girounivers {
            storeFile file("$rootDir/keystore/girounivers.jks")
            storePassword 'girounivers'; keyAlias 'girounivers'; keyPassword 'girounivers'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.girounivers }
        release { minifyEnabled false; signingConfig signingConfigs.girounivers }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
